server:
  port: 8080
  mode: debug # debug, release, test

jwt:
  secret: "my_secret_key"

services:
  user_service: "localhost:8081"
  product_service: "localhost:8082"
  order_service: "localhost:8083"

cors:
  allow_origins:
    - "*"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"
